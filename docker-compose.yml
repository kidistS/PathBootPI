# ─────────────────────────────────────────────────────────────────────────────
# PathBoot – Docker Compose
#
# LOCATION: place this file at the PARENT (pathboot/) level after restructure:
#   pathboot/
#   ├── pathboot-pi/        ← Spring Boot backend
#   ├── pathboot-ui/        ← React frontend
#   └── docker-compose.yml  ← this file
#
# Secrets: copy .env.example → .env and fill in real values (never commit .env)
#
# Usage:
#   docker compose up --build     # first run (builds images)
#   docker compose up -d          # background
#   docker compose down           # stop all
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Spring Boot Backend ────────────────────────────────────────────────────
  backend:
    build:
      context: ./pathboot-pi
      dockerfile: Dockerfile
    container_name: pathboot-backend
    ports:
      - "8080:8080"
    environment:
      PATHBOOT_API_KEY_1:       ${PATHBOOT_API_KEY_1:-pathboot-dev-key-2026}
      PATHBOOT_API_KEY_2:       ${PATHBOOT_API_KEY_2:-pathboot-local-key-001}
      PATHBOOT_ADMIN_PASSWORD:  ${PATHBOOT_ADMIN_PASSWORD:-pathboot-admin-2026}
      PATHBOOT_USER_PASSWORD:   ${PATHBOOT_USER_PASSWORD:-pathboot-user-2026}
      # Point to sibling containers – NOT localhost
      SPRING_AI_OLLAMA_BASE_URL: http://ollama:11434
      NLLB_SERVER_BASE_URL:      http://nllb:5000
    volumes:
      - ./pathboot-pi/data:/app/data   # SQLite DB + vector store survive restarts
    depends_on:
      - ollama
      - nllb
    restart: unless-stopped

  # ── React Frontend ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./pathboot-ui
      dockerfile: Dockerfile
    container_name: pathboot-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  # ── Ollama (Mistral LLM) ───────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: pathboot-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama      # model weights cached between restarts
    restart: unless-stopped

  # ── NLLB Translation Server (Python) ──────────────────────────────────────
  nllb:
    build:
      context: ./pathboot-pi
      dockerfile: Dockerfile.nllb
    container_name: pathboot-nllb
    ports:
      - "5000:5000"
    restart: unless-stopped

volumes:
  ollama_data:

