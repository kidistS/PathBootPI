spring:
  application:
    name: pathboot-pi
  # ─── Profile-Specific Database and JPA Settings ────────────────────────────
  # Datasource, JPA, and cache settings are defined in profile-specific files:
  # - application-local.yml  (SQLite)
  # - application-test.yml   (PostgreSQL + H2 in tests)
  # - application-prod.yml   (PostgreSQL)
  cache:
    type: caffeine
  # ─── Spring AI – Ollama / Mistral ───────────────────────────────────────────
  ai:
    ollama:
      base-url: ${SPRING_AI_OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: mistral
          temperature: 0.1      # lower = faster, more deterministic (factual QA needs no creativity)
          num-predict: 200      # "2-3 sentences" rarely exceeds 150 tokens; cap prevents runaway output
          num-ctx: 1024         # RAG top-3 chunks + question fits in 1 k tokens; halves attention cost vs 2048
          keep-alive: "-1m"     # NEVER unload model from RAM – eliminates the 5-15 s cold-start on every idle request
      # Embedding model for RAG vector store (uses same Ollama instance)
      # Pull with: ollama pull nomic-embed-text
      # Falls back gracefully if not available
      embedding:
        options:
          model: nomic-embed-text
# ─── NLLB Translation Server (local Python) ────────────────────────────────
nllb:
  server:
    base-url: ${NLLB_SERVER_BASE_URL:http://localhost:5000}
    translate-endpoint: /translate
    connect-timeout-ms: 5000
    read-timeout-ms: 120000   # 2 min – NLLB-600M on CPU can take 30-90 s on first call
# ─── RAG Vector Store ─────────────────────────────────────────────────────────
rag:
  top-k: 3                         # number of relevant chunks returned per query
  chunk-min-length: 30             # ignore chunks shorter than this (headers/blanks)
  enabled: true                    # set false to fall back to full grounding file
  store-path: ./data/vector-store.json  # persisted embeddings – loaded on restart, built on first run
# ─── API Key Security ────────────────────────────────────────────────────
# PRODUCTION HARDENING:
#   Override all secrets via environment variables – never commit real credentials.
#   Example (Docker / Kubernetes):
#     PATHBOOT_API_KEY_1=<real-key-1>
#     PATHBOOT_API_KEY_2=<real-key-2>
#     PATHBOOT_ADMIN_PASSWORD=<bcrypt-or-random>
#     PATHBOOT_USER_PASSWORD=<bcrypt-or-random>
#   The ${VAR:default} syntax uses the env var when present, falling back to the
#   default only in local development where secrets do not matter.
api:
  security:
    enabled: true
    # Add or rotate keys by editing this list — no code change required.
    api-keys:
      - "${PATHBOOT_API_KEY_1:pathboot-dev-key-2026}"
      - "${PATHBOOT_API_KEY_2:pathboot-local-key-001}"
    # Login credentials for POST /api/v1/auth/login
    users:
      admin: "${PATHBOOT_ADMIN_PASSWORD:pathboot-admin-2026}"
      user:  "${PATHBOOT_USER_PASSWORD:pathboot-user-2026}"
    # Per-user API key mapping — each user receives their own key on login.
    user-keys:
      admin: "${PATHBOOT_API_KEY_1:pathboot-dev-key-2026}"
      user:  "${PATHBOOT_API_KEY_2:pathboot-local-key-001}"
# ─── Server ─────────────────────────────────────────────────────────────────
server:
  port: 8080
  error:
    include-message: never          # do not leak internal exception messages to clients
    include-binding-errors: never   # validation details returned by GlobalExceptionHandler instead
# ─── Springdoc / Swagger ─────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    display-request-duration: true
# ─── Actuator ────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized   # avoid exposing DB/disk details publicly
# ─── Logging (Log4j2 – see log4j2.xml for full config) ────────────────────
logging:
  config: classpath:log4j2.xml

